<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="OrbSniper">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#ffab1a"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffab1a" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ff8a00" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash" cx="0%" cy="0%" r="100%">
      <stop offset="0" stop-color="#ffab1a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffab1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#07080b"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#wash)"/>
  <circle cx="262" cy="320" r="260" fill="url(#halo)"/>
  <svg x="102" y="160" width="320" height="320" viewBox="0 0 256 256">
  
  <defs>
    <linearGradient id="ic-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2029"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="ic-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffab1a" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="ic-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffab1a" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#ff8a00" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ic-orb" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset=".22" stop-color="#ffd27a"/>
      <stop offset=".58" stop-color="#ffa516"/>
      <stop offset="1" stop-color="#b85200"/>
    </radialGradient>
    <linearGradient id="ic-tick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9a0a"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#ic-tile)"/>
  <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="url(#ic-rim)" stroke-width="2"/>

  <circle cx="128" cy="128" r="104" fill="url(#ic-glow)"/>

  
  <g fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="6" stroke-linecap="round">
    <path d="M146.6 50.2 A80 80 0 0 1 205.8 109.4"/>
    <path d="M205.8 146.6 A80 80 0 0 1 146.6 205.8"/>
    <path d="M109.4 205.8 A80 80 0 0 1 50.2 146.6"/>
    <path d="M50.2 109.4 A80 80 0 0 1 109.4 50.2"/>
  </g>
  <g stroke="url(#ic-tick)" stroke-width="12" stroke-linecap="round">
    <path d="M128 36v30M128 190v30M36 128h30M190 128h30"/>
  </g>

  <circle cx="128" cy="128" r="44" fill="url(#ic-orb)"/>
  <circle cx="128" cy="128" r="44" fill="none" stroke="#7a3500" stroke-opacity=".35" stroke-width="2"/>
  <ellipse cx="114" cy="108" rx="17" ry="10" fill="#ffffff" opacity=".6" transform="rotate(-32 114 108)"/>
</svg>
  <g transform="translate(486 0)">
    <text x="0" y="250" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-3" fill="#f3f5f8">Orb<tspan fill="url(#amber)">Sniper</tspan></text>
    <text x="5" y="306" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="600" fill="#e6ebf2">Farm Discord Orbs while you are away</text>
    <text x="5" y="350" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="400" fill="#a3acb9">Auto-completes Quests. Trade Orbs for Nitro and decorations.</text>
    <g transform="translate(5 390)">
      <rect x="0" width="136" height="42" rx="10" fill="#12151b" stroke="#262b34" stroke-width="1.5"/><text x="68.0" y="27.1" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#a3acb9">no token</text>
      <rect x="148" width="168" height="42" rx="10" fill="#12151b" stroke="#262b34" stroke-width="1.5"/><text x="232.0" y="27.1" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#a3acb9">10 languages</text>
      <rect x="328" width="164" height="42" rx="10" fill="#12151b" stroke="#262b34" stroke-width="1.5"/><text x="410.0" y="27.1" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#a3acb9">open source</text>
      <rect x="504" width="104" height="42" rx="10" fill="#2a1f08" stroke="#5c4413" stroke-width="1.5"/><text x="556.0" y="27.1" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffab1a">free</text>
    </g>
    <text x="5" y="492" font-family="Cascadia Mono, Consolas, monospace" font-size="20" fill="#5a6270">github.com/syntaxixr/OrbSniper</text>
  </g>
</svg>
